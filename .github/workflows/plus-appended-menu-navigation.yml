name: Plus appended menu navigation candidate
on:
  push:
    branches: ['audit/plus-appended-menu-navigation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Re-run when the injector fixture changes.
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Madcadden/mouse-injector
          ref: fix/plus-appended-menu-navigation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Joshua-1248/GoldenEye-007-Plus
          ref: c42295ba400386aac4140957b6f7fa9e53ab911d
          path: plus-reference
          persist-credentials: false
      - name: Materialize the user-confirmed FreeFly-F3 baseline
        run: |
          python3 tools/prepare_freefly_f3.py
          python3 tools/apply_plus_levelmod_cursor.py
      - name: Audit latest Plus menu stack
        run: |
          python3 tests/test_plus_appended_menus.py plus-reference | tee menu-audit.txt
      - name: Install Win32 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Build Win32 injector
        run: |
          mkdir -p obj candidate/plugin
          make -j2 _mouseinjector CC=i686-w64-mingw32-gcc WINDRES=i686-w64-mingw32-windres
          cp Mouse_Injector.dll candidate/plugin/
          i686-w64-mingw32-objdump -p Mouse_Injector.dll > candidate/pe-info.txt
          cp menu-audit.txt candidate/
      - name: Preserve exact source and hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          skip={'.git','candidate','plus-reference','obj'}
          with zipfile.ZipFile('candidate/Mouse-Injector-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if not p.is_file() or any(part in skip for part in p.parts):
                      continue
                  z.write(p,p.as_posix())
          PY
          git rev-parse HEAD > candidate/source-commit.txt
          sha256sum candidate/plugin/Mouse_Injector.dll candidate/Mouse-Injector-Source.zip > candidate/SHA256SUMS.txt
          cat > candidate/README.txt <<'EOF'
          GoldenEye 007 Plus appended-menu navigation candidate.
          Replace only plugin/Mouse_Injector.dll.
          Built from the confirmed FreeFly-F3 source baseline.
          Latest Plus Level Modifiers uses exact cursor hitboxes, direct row selectors and empty-space click gating.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: plus-menu-navigation-${{ github.sha }}
          path: candidate/
          retention-days: 14
          # candidate rebuilt after validated source-generation fix
          if-no-files-found: error
