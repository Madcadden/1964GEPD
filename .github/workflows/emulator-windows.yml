name: Build Windows emulator candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/auto-mod-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Release Win32 and record hashes
        shell: pwsh
        run: ./tools/build_emulator.ps1 -SourceRoot . -OutputDirectory ./candidate
      - name: Include corresponding source
        shell: pwsh
        run: |
          git archive --format=zip --output=candidate/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          git rev-parse HEAD | Set-Content candidate/source-commit.txt
      - name: Collect reference graphics plugin for compatibility checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/Graslu/1964GEPD/releases/download/latest/1964_GEPD_Edition_.No_DRP.zip' -OutFile bundle.zip
          if ((Get-FileHash bundle.zip -Algorithm SHA1).Hash -ne 'D7C7099A41E8AE3427EAE22D8F95796D9DFC44A8') { throw 'Unexpected reference bundle; refusing to use changed binaries' }
          Expand-Archive bundle.zip -DestinationPath reference
          New-Item -ItemType Directory -Force candidate/reference | Out-Null
          Get-ChildItem reference -Recurse -File | Where-Object { $_.Name -match '^(GLN64_2020|GLideN64)' -or $_.Name -match '(?i)(license|copying|bundle_readme)' } | Copy-Item -Destination candidate/reference
          Get-ChildItem candidate/reference -File | Get-FileHash | Format-Table -AutoSize | Out-String -Width 240 | Set-Content candidate/reference-hashes.txt
      - name: Upload candidate and build verification
        uses: actions/upload-artifact@v4
        with:
          name: 1964-win32-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
