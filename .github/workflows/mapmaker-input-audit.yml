name: Map Maker input audit
on:
  workflow_dispatch:
  push:
    branches: ['audit/mapmaker-inputs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Madcadden/mouse-injector
          ref: fe5a085f88756156035785a5a18cbe3e7234fb36
          persist-credentials: false
      - name: Apply reviewed candidate and diagnostic integration
        run: |
          git apply --check tools/mapmaker-input-compat.patch
          git apply tools/mapmaker-input-compat.patch
          git apply --check tools/freefly-trace.patch
          git apply tools/freefly-trace.patch
          mkdir -p audit-out obj
      - name: Install Win32 build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Build input plugin
        run: |
          set -o pipefail
          make -j2 CC=i686-w64-mingw32-gcc WINDRES=i686-w64-mingw32-windres 2>&1 | tee audit-out/build.log
          cp Mouse_Injector.dll audit-out/
          i686-w64-mingw32-objdump -p Mouse_Injector.dll > audit-out/pe-info.txt
          i686-w64-mingw32-gcc --version > audit-out/compiler.txt
      - name: Preserve exact compiled source and hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.')
          paths=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          paths += ['freefly_trace.h','games/goldeneye.freeflytrace.h','games/goldeneye.freeflyreport.h']
          manifest={}
          with zipfile.ZipFile('audit-out/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(paths)):
                  raw=(root/name).read_bytes()
                  z.writestr(name,raw)
                  manifest[name]=hashlib.sha256(raw).hexdigest()
          manifest['Mouse_Injector.dll']=hashlib.sha256(pathlib.Path('Mouse_Injector.dll').read_bytes()).hexdigest()
          pathlib.Path('audit-out/build-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git rev-parse HEAD > audit-out/commit.txt
      - name: Read current published injector for comparison
        run: |
          curl -fL --retry 2 'https://github.com/Madcadden/1964GEPD/releases/download/automatic-mod-compatibility-v0.2.2/1964GEPD-Automatic-Mod-Compatibility-v0.2.2.zip' -o current-release.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          raw=pathlib.Path('current-release.zip').read_bytes()
          with zipfile.ZipFile('current-release.zip') as z:
              dll=z.read('plugin/Mouse_Injector.dll')
              exe=z.read('1964.exe')
          out=pathlib.Path('audit-out/published');out.mkdir()
          (out/'Mouse_Injector.dll').write_bytes(dll)
          (out/'hashes.json').write_text(json.dumps({'zip':hashlib.sha256(raw).hexdigest(),'exe':hashlib.sha256(exe).hexdigest(),'injector':hashlib.sha256(dll).hexdigest()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: freefly-f2-${{ github.sha }}
          path: audit-out/
          retention-days: 14
          if-no-files-found: error
